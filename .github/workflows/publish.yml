name: Publish
run-name: Publish ${{ github.ref_name }} as v${{ github.event.inputs.version }}

# Consumers pin a revision of this repository rather than a published package version, so a release
# is a repository tag: one tag pins both packages at once. These packages are not published to npm —
# paranext-core builds them from source. See the README's "Releasing" section.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, matching the platform-editor version on this branch, e.g. 0.9.0. Tagged as `v<version>`."
        required: true
      prerelease:
        description: "Mark the GitHub release as a pre-release."
        type: boolean
        required: false
        default: true
      newVersionAfterPublishing:
        description: "Version to bump platform-editor to after releasing, e.g. 0.10.0. Leave blank not to bump."
        required: false
      bumpRef:
        description: "Git ref to create the bump-versions branch from, e.g. `main`. Leave blank to use the branch this run targets."
        required: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the requested version matches platform-editor on this branch
        # A tag that disagrees with the manifest would pin consumers to a build whose version says
        # something else, so fail before creating it rather than after.
        run: |
          MANIFEST_VERSION=$(node -p "require('./packages/platform/package.json').version")
          if [ "$MANIFEST_VERSION" != "${{ github.event.inputs.version }}" ]; then
            echo "packages/platform/package.json is $MANIFEST_VERSION but you asked to release ${{ github.event.inputs.version }}."
            echo "Dispatch the Bump Versions workflow first, or release the version already on this branch."
            exit 1
          fi

      # A release is a repository tag, and a tag cannot be un-cut. Everything below runs before the
      # release step so a branch that would not pass on `main` cannot become a release. `run-many`
      # rather than `affected`: there is no base revision to be affected relative to here.
      - name: Check formatting
        run: |
          pnpm prettier --check .
          pnpm nx format:check

      - name: Check linting
        run: pnpm nx run-many -t lint

      - name: Check types
        run: pnpm nx run-many -t typecheck

      - name: Check tests
        run: pnpm nx run-many -t test

      - name: Production build
        run: pnpm nx run-many -t build

      # Consumers copy the committed dist straight out of a tagged checkout, so a tag carrying a
      # stale one ships stale code with nothing to reveal it. `test.yml` makes this check on `main`
      # only; a release can be cut from any branch.
      - name: Check the committed dist is current
        # --skip-nx-cache so this is a real build: nx declares `dist` a cached target output, so a
        # cache hit restores its copy over the committed one and the check would grade the cache
        # rather than the source.
        run: |
          pnpm nx run-many -t extract-api --skip-nx-cache
          node scripts/verify-committed-dist.mjs

      - name: Create the release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.event.inputs.version }}
          commit: ${{ github.sha }}
          name: v${{ github.event.inputs.version }}
          generateReleaseNotes: true
          prerelease: ${{ github.event.inputs.prerelease }}

      - name: Check out the ref to bump versions on
        if: ${{ github.event.inputs.newVersionAfterPublishing != '' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.bumpRef || github.ref_name }}

      # `actions/checkout` cleans the workspace, which takes `node_modules` with it. The release
      # tag already exists by this point and `bump-versions` is not idempotent, so a failure here
      # has to be unpicked by hand — reinstall rather than rely on what the first checkout left.
      - name: Reinstall dependencies for the bump
        if: ${{ github.event.inputs.newVersionAfterPublishing != '' }}
        run: pnpm install --frozen-lockfile

      - name: Bump versions for continued development
        if: ${{ github.event.inputs.newVersionAfterPublishing != '' }}
        uses: ./.github/actions/bump-versions-action
        with:
          platformVersion: ${{ github.event.inputs.newVersionAfterPublishing }}
