name: Publish
run-name: Publish ${{ github.ref_name }} as v${{ github.event.inputs.version }}

# Consumers pin a revision of this repository rather than a published package version, so a release
# is a repository tag: one tag pins both packages at once. These packages are not published to npm —
# paranext-core builds them from source. See the README's "Releasing" section.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, matching the platform-editor version on this branch, e.g. 0.9.0. Tagged as `v<version>`."
        required: true
      prerelease:
        description: "Mark the GitHub release as a pre-release."
        type: boolean
        required: false
        default: true
      newVersionAfterPublishing:
        description: "Version to bump platform-editor to after releasing, e.g. 0.10.0. Leave blank not to bump."
        required: false
      bumpRef:
        description: "Git ref to create the bump-versions branch from, e.g. `main`. Leave blank to use the branch this run targets."
        required: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PNPM
        uses: pnpm/action-setup@v3
        with:
          version: 10

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          # The Volta pin in package.json. This job rebuilds the committed `dist/` and cuts the
          # release tag consumers copy their editor out of, so it must match local development.
          node-version-file: "package.json"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify the requested version matches platform-editor on this branch
        # A tag that disagrees with the manifest would pin consumers to a build whose version says
        # something else, so fail before creating it rather than after.
        #
        # The requested version reaches the shell through `env`, not `${{ }}` interpolation, so a
        # dispatch input cannot splice shell into this script.
        env:
          REQUESTED_VERSION: ${{ github.event.inputs.version }}
        run: |
          MANIFEST_VERSION=$(node -p "require('./packages/platform/package.json').version")
          if [ "$MANIFEST_VERSION" != "$REQUESTED_VERSION" ]; then
            echo "packages/platform/package.json is $MANIFEST_VERSION but you asked to release $REQUESTED_VERSION."
            echo "Dispatch the Bump Versions workflow first, or release the version already on this branch."
            exit 1
          fi

      # Formatting, lint, typecheck and tests are not repeated here: `test.yml` runs them on every
      # push to the branches releases are cut from, the same division paranext-core uses.
      #
      # The committed dist is different, and is checked here as well. A tag is what consumers copy
      # their editor out of, a tag cannot be un-cut, and a stale dist inside one is invisible —
      # nothing about the tag looks wrong. `extract-api` is the build, so this replaces a separate
      # build step rather than adding to it.
      - name: Build and check the committed dist is current
        # --skip-nx-cache so this is a real build: nx declares `dist` a cached target output, so a
        # cache hit restores its copy over the committed one and the check would grade the cache
        # rather than the source.
        run: |
          pnpm nx run-many -t extract-api --skip-nx-cache
          node scripts/verify-committed-dist.mjs

      # One repo tag pins both packages, and the tag name carries only platform-editor's version, so
      # the utilities version a consumer gets is otherwise invisible from the releases page.
      - name: Read the utilities version this tag ships
        id: utilities
        run: echo "version=$(node -p "require('./packages/utilities/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Create the release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ github.event.inputs.version }}
          commit: ${{ github.sha }}
          name: v${{ github.event.inputs.version }}
          body: |
            | Package | Version |
            | --- | --- |
            | `@eten-tech-foundation/platform-editor` | ${{ github.event.inputs.version }} |
            | `@eten-tech-foundation/scripture-utilities` | ${{ steps.utilities.outputs.version }} |
          generateReleaseNotes: true
          prerelease: ${{ github.event.inputs.prerelease }}

      # `clean: false` because the default would `git clean -ffdx` the workspace, taking
      # `node_modules` with it, and the bump action runs `tsx`. The release tag exists by this
      # point and cannot be un-cut, so `bump-versions` is idempotent: re-running this publish
      # reuses the bump branch and skips the commit when the manifests already say the new version.
      - name: Check out the ref to bump versions on
        if: ${{ github.event.inputs.newVersionAfterPublishing != '' && github.event.inputs.bumpRef != '' && github.event.inputs.bumpRef != github.ref_name }}
        uses: actions/checkout@v4
        with:
          clean: false
          ref: ${{ github.event.inputs.bumpRef }}

      - name: Bump versions for continued development
        if: ${{ github.event.inputs.newVersionAfterPublishing != '' }}
        uses: ./.github/actions/bump-versions-action
        with:
          platformVersion: ${{ github.event.inputs.newVersionAfterPublishing }}
