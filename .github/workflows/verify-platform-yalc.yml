name: Verify platform-yalc consumer sync

# paranext-core's package-lock.json records this repo's packages' dependency closure. When a
# dependency changes here and platform-yalc moves, every core build fails until core's lockfile is
# refreshed. This check makes that visible to the person moving the branch — it passes when core's
# main (or an open core PR touching package-lock.json) matches this branch's dependencies, and
# fails with instructions otherwise. Only this repo's dependency lists matter here: raising a
# package's OWN version number (e.g. platform-editor 0.8.16 -> 0.8.17) changes nothing core's
# lockfile validates, so those pass untouched.
#
# Re-run it (Actions -> this workflow -> Re-run, or the workflow_dispatch button) after the core
# lockfile PR is opened.

on:
  push:
    branches: ["platform-yalc"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Core lockfile in sync
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v4

      - name: Verify paranext-core's lockfile matches this branch's dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/verify-consumer-lockfile-sync.mjs
