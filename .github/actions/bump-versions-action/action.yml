name: Bump Versions Action
description: |
  Runs the bump-versions script and pushes the branch it creates.

inputs:
  platformVersion:
    description: "Version to set for platform-editor on a new branch (called `bump-versions-<version>`), e.g. 0.9.0."
    required: true
  utilitiesVersion:
    description: "Version to set for scripture-utilities. Leave blank to leave it unchanged."
    required: false

runs:
  using: "composite"
  steps:
    - name: Bump package versions
      # Pushes using the built-in git token https://github.com/actions/checkout/tree/v4/?tab=readme-ov-file#push-a-commit-using-the-built-in-token
      shell: bash
      # The versions arrive as workflow_dispatch input, so they reach the shell through `env` and
      # quoted expansions rather than `${{ }}` interpolation, which would splice whatever was typed
      # straight into this script before bash ever sees it.
      env:
        PLATFORM_VERSION: ${{ inputs.platformVersion }}
        UTILITIES_VERSION: ${{ inputs.utilitiesVersion }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        if [ -n "$UTILITIES_VERSION" ]; then
          pnpm bump-versions "$PLATFORM_VERSION" --utilities "$UTILITIES_VERSION"
        else
          pnpm bump-versions "$PLATFORM_VERSION"
        fi
        git push origin "bump-versions-$PLATFORM_VERSION"
